<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LUCA6 – Mission Bundesliga</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LUCA6">
<meta name="theme-color" content="#0B1E3D">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B1E3D;
    --bg-elev: #122A54;
    --bg-elev-2: #183765;
    --pitch: #1D4E9B;
    --pitch-light: #3E74C7;
    --chalk: #F5F7FA;
    --chalk-dim: #C3CCDA;
    --muted: #7A8AA5;
    --amber: #F5F7FA;
    --amber-dim: #5A6B87;
    --red: #C0483B;
    --border: #24365C;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--chalk);
    font-family: 'Inter', system-ui, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
    padding-bottom: 4rem;
  }
  h1,h2,h3{
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0;
  }
  .mono{ font-family: 'JetBrains Mono', monospace; }
  a{ color: var(--amber); }
  button{
    font-family: 'Inter', sans-serif;
    cursor: pointer;
  }
  input, select, textarea{
    font-family: 'Inter', sans-serif;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--chalk);
    border-radius: 6px;
    padding: 0.5rem 0.6rem;
    font-size: 14px;
  }
  input:focus, select:focus, textarea:focus, button:focus-visible{
    outline: 2px solid var(--amber);
    outline-offset: 1px;
  }
  ::placeholder{ color: var(--muted); }

  .wrap{ max-width: 760px; margin: 0 auto; padding: 1.5rem 1.25rem 0; }

  /* ---- Kopfbereich / Profilwahl ---- */
  .topbar{
    display:flex; align-items:center; justify-content: space-between;
    margin-bottom: 1.5rem;
  }
  .brand{ display:flex; align-items:center; gap:0.6rem; }
  .brand .dot{ width:10px; height:10px; border-radius:50%; background: var(--amber); }
  .brand .logo{ width:34px; height:34px; border-radius:6px; display:block; }
  .brand span{ font-family:'Oswald', sans-serif; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--chalk-dim); }

  .profiles{ display:flex; gap:0.5rem; margin-bottom: 1.5rem; }
  .profile-tab{
    flex:1;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.9rem 1rem;
    text-align: left;
    color: var(--chalk-dim);
    transition: none;
  }
  .profile-tab .num{
    font-family:'JetBrains Mono', monospace;
    font-size: 22px; font-weight:700;
    color: var(--muted);
    display:block;
    margin-bottom: 2px;
  }
  .profile-tab .name{ font-family:'Oswald', sans-serif; font-size: 16px; color: var(--chalk-dim); }
  .profile-tab.active{
    border-color: var(--pitch-light);
    background: var(--bg-elev-2);
  }
  .profile-tab.active .num{ color: var(--amber); }
  .profile-tab.active .name{ color: var(--chalk); }

  /* ---- Anstoss-Uhr / Countdown ---- */
  .scoreboard{
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.1rem;
    display:flex; align-items:center; justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1.75rem;
    flex-wrap: wrap;
  }
  .scoreboard .label{ font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 4px; }
  .scoreboard .count{ font-family:'JetBrains Mono', monospace; font-size: 30px; font-weight:700; color: var(--amber); }
  .scoreboard .count small{ font-size: 14px; color: var(--chalk-dim); font-weight: 500; margin-left: 6px; }
  .scoreboard .set-date{ display:flex; align-items:center; gap:0.5rem; }
  .scoreboard input[type=date]{ font-size: 13px; padding: 0.4rem 0.5rem; }

  /* ---- Sektionen / Tabs ---- */
  .section-nav{
    display:flex; gap: 1.5rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1.5rem;
  }
  .section-nav button{
    background:none; border:none; color: var(--muted);
    font-family:'Oswald', sans-serif; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase;
    padding: 0 0 0.7rem;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .section-nav button.active{
    color: var(--chalk);
    border-bottom-color: var(--amber);
  }

  .card{
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.1rem 1.2rem;
    margin-bottom: 1rem;
  }
  .card h3{ font-size: 16px; margin-bottom: 0.75rem; color: var(--chalk); }
  .muted{ color: var(--muted); font-size: 13px; }

  /* ---- Trainingsplan ---- */
  .day-block{ margin-bottom: 0.9rem; }
  .day-title{
    font-family:'Oswald', sans-serif; font-size: 13px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--pitch-light); margin-bottom: 0.4rem;
  }
  .exercise-row{
    display:flex; align-items:center; gap: 0.6rem;
    padding: 0.4rem 0; border-bottom: 1px solid var(--border);
  }
  .exercise-row:last-child{ border-bottom: none; }
  .exercise-row input[type=checkbox]{
    width: 18px; height: 18px; accent-color: var(--pitch-light); flex-shrink:0;
  }
  .exercise-row .ex-text{ flex:1; font-size: 14px; }
  .exercise-row.done .ex-text{ color: var(--muted); text-decoration: line-through; }
  .exercise-row button.del{
    background:none; border:none; color: var(--muted); font-size: 16px; line-height:1; padding: 2px 4px;
  }
  .exercise-row button.del:hover{ color: var(--red); }
  .add-ex{ display:flex; gap: 0.5rem; margin-top: 0.5rem; }
  .add-ex input{ flex:1; }
  .btn{
    background: var(--bg-elev-2); border: 1px solid var(--pitch-light);
    color: var(--chalk); border-radius: 6px; padding: 0.5rem 0.9rem; font-size: 13px;
  }
  .btn:hover{ background: var(--pitch); }
  .btn.small{ padding: 0.35rem 0.6rem; font-size: 12px; }
  .btn.subtle{ background:none; border-color: var(--border); color: var(--muted); }

  /* ---- Tracking ---- */
  .stat-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap: 0.7rem; margin-bottom: 1rem; }
  .stat{
    background: var(--bg-elev-2); border-radius: var(--radius); padding: 0.8rem;
    text-align:center;
  }
  .stat .val{ font-family:'JetBrains Mono', monospace; font-size: 22px; font-weight:700; color: var(--amber); }
  .stat .lbl{ font-size: 11px; text-transform:uppercase; letter-spacing:0.05em; color: var(--muted); margin-top:2px; }

  .log-form{ display:grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-bottom: 0.5rem; }
  .log-form .full{ grid-column: 1 / -1; }
  .log-form label{ font-size: 12px; color: var(--muted); display:block; margin-bottom: 3px; }
  input[type=range]{ width:100%; accent-color: var(--amber); }

  .log-entry{
    display:flex; align-items:flex-start; justify-content: space-between; gap: 0.75rem;
    padding: 0.6rem 0; border-bottom: 1px solid var(--border);
  }
  .log-entry:last-child{ border-bottom:none; }
  .log-entry .le-main{ font-size: 14px; }
  .log-entry .le-date{ color: var(--muted); font-size: 12px; margin-right: 0.5rem; }
  .log-entry .le-note{ color: var(--chalk-dim); font-size: 13px; margin-top: 2px; }
  .log-entry button.del{ background:none; border:none; color: var(--muted); font-size: 15px; }
  .log-entry button.del:hover{ color: var(--red); }

  /* ---- Ernaehrung ---- */
  .nutri-block{ margin-bottom: 0.9rem; }
  .nutri-block .when{
    font-family:'Oswald', sans-serif; font-size: 13px; color: var(--amber);
    text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.3rem;
  }
  .nutri-block ul{ margin: 0; padding-left: 1.1rem; font-size: 14px; color: var(--chalk-dim); }
  .nutri-block li{ margin-bottom: 0.25rem; }

  .empty{ color: var(--muted); font-size: 13px; padding: 0.5rem 0; }

  /* ---- 10-Tage-Block ---- */
  .fuerte-day.is-done{ border-color: var(--pitch-light); }
  .fd-head{ display:flex; align-items:baseline; gap:0.6rem; flex-wrap:wrap; margin-bottom:0.6rem; }
  .fd-num{ font-size:13px; font-weight:700; color: var(--pitch-light); }
  .fd-title{ font-family:'Oswald', sans-serif; font-size:16px; color: var(--chalk); }
  .fd-focus{ font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color: var(--muted); border:1px solid var(--border); border-radius:20px; padding:2px 8px; }
  .fd-list{ margin:0 0 0.6rem; padding-left:1.1rem; font-size:14px; color: var(--chalk-dim); }
  .fd-list li{ margin-bottom:0.3rem; line-height:1.45; }
  .fd-note{ font-size:13px; color: var(--pitch-light); border-left:2px solid var(--pitch-light); padding-left:0.6rem; margin-bottom:0.7rem; }
  .fd-ctrls{ display:flex; align-items:flex-end; gap:0.8rem; flex-wrap:wrap; border-top:1px solid var(--border); padding-top:0.7rem; }
  .fd-done{ display:flex; align-items:center; gap:0.4rem; font-size:13px; color: var(--chalk-dim); }
  .fd-done input{ width:18px; height:18px; accent-color: var(--pitch-light); }
  .fd-field{ display:flex; flex-direction:column; gap:2px; }
  .fd-field label{ font-size:11px; color: var(--muted); }
  .fd-field input{ width:170px; }
  .fd-field.rpe input{ width:70px; }

  /* ---- Scoreboard: nächstes Spiel ---- */
  .next-match{ text-align:right; }
  .nm-title{ font-family:'Oswald', sans-serif; font-size:15px; color: var(--chalk); }
  .nm-meta{ font-size:12px; }

  /* ---- Termine ---- */
  .term-tools{ display:flex; flex-direction:column; gap:0.8rem; }
  .wd-row{ display:flex; flex-wrap:wrap; gap:0.4rem; }
  .wd-chip{ display:flex; align-items:center; gap:0.35rem; font-size:13px; color: var(--chalk-dim); border:1px solid var(--border); border-radius:20px; padding:3px 10px; cursor:pointer; }
  .wd-chip input{ width:15px; height:15px; accent-color: var(--pitch-light); }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0.6rem; }
  .form-grid .full{ grid-column:1/-1; }
  .form-grid label{ font-size:12px; color: var(--muted); display:block; margin-bottom:3px; }
  .status{ font-size:12px; color: var(--pitch-light); min-height:14px; margin-top:0.3rem; }
  .month-head{ font-family:'Oswald', sans-serif; font-size:13px; text-transform:uppercase; letter-spacing:0.06em; color: var(--pitch-light); margin:1rem 0 0.3rem; }
  .ev-row{ display:flex; align-items:flex-start; gap:0.6rem; padding:0.55rem 0; border-bottom:1px solid var(--border); }
  .ev-row:last-child{ border-bottom:none; }
  .ev-date{ font-family:'JetBrains Mono', monospace; font-size:12px; color: var(--chalk-dim); white-space:nowrap; min-width:84px; }
  .ev-body{ flex:1; }
  .ev-title{ font-size:14px; color: var(--chalk); }
  .ev-sub{ font-size:12px; color: var(--muted); margin-top:1px; }
  .ev-badge{ font-size:10px; text-transform:uppercase; letter-spacing:0.04em; border-radius:20px; padding:2px 8px; white-space:nowrap; }
  .b-spiel{ background: var(--pitch-light); color:#0B1E3D; }
  .b-test{ background: var(--bg-elev-2); color: var(--chalk-dim); border:1px solid var(--pitch-light); }
  .b-training{ border:1px solid var(--border); color: var(--muted); }
  .b-individuell{ border:1px solid var(--border); color: var(--chalk-dim); }
  .ev-row button.del{ background:none; border:none; color: var(--muted); font-size:15px; }
  .ev-row button.del:hover{ color: var(--red); }

  @media (max-width: 480px){
    .log-form{ grid-template-columns: 1fr; }
    .form-grid{ grid-template-columns: 1fr; }
    .stat-grid{ grid-template-columns: repeat(3,1fr); }
    .scoreboard{ flex-direction: column; align-items: flex-start; }
    .next-match{ text-align:left; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; animation: none !important; }
  }

  /* ---- Dashboard / Coach-Erweiterung ---- */
  .dashboard-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem;margin-bottom:1rem}
  .dash-card{background:var(--bg-elev-2);border:1px solid var(--border);border-radius:var(--radius);padding:.85rem}
  .dash-card .kicker{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .dash-card .big{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:var(--amber);margin-top:3px}
  .dash-card .small{font-size:12px;color:var(--chalk-dim);margin-top:3px}
  .coach-box{border-left:3px solid var(--pitch-light);background:linear-gradient(90deg,rgba(52,168,83,.09),transparent)}
  .coach-title{font-family:'Oswald',sans-serif;font-size:18px;margin-bottom:.35rem}
  .readiness-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}
  .readiness-grid label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
  .readiness-grid select,.readiness-grid input{width:100%}
  .chart-wrap{height:210px;position:relative;margin-top:.8rem}
  .chart-wrap canvas{width:100%;height:100%;display:block}
  .progress-bar{height:9px;background:var(--bg);border-radius:10px;overflow:hidden;margin-top:.45rem}
  .progress-bar span{display:block;height:100%;background:var(--pitch-light);border-radius:10px}
  .achievement-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
  .achievement{padding:.7rem;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:12px}
  .achievement.unlocked{border-color:var(--amber);color:var(--chalk);background:rgba(255,183,3,.06)}
  .tools-row{display:flex;gap:.5rem;flex-wrap:wrap}
  .warning{color:#ffcc80;font-size:12px}
  @media(max-width:700px){.dashboard-grid{grid-template-columns:repeat(2,1fr)}.readiness-grid{grid-template-columns:1fr 1fr}.achievement-grid{grid-template-columns:1fr}.section-nav{overflow-x:auto;gap:1rem;padding-bottom:2px}.section-nav button{white-space:nowrap}}


  .player-profile{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.profile-chip{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);padding:10px;border-radius:12px}.profile-chip b{display:block;font-size:.75rem;text-transform:uppercase;opacity:.7;margin-bottom:3px}.exercise-links{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.video-link{display:inline-flex;align-items:center;gap:5px;padding:7px 10px;border-radius:999px;background:#e62117;color:#fff!important;text-decoration:none;font-size:.82rem;font-weight:700}.load-warning{margin:10px 0;padding:10px 12px;border-left:4px solid #ffb020;background:rgba(255,176,32,.10);border-radius:8px;font-size:.88rem}.day-goal{font-weight:700;margin:8px 0 4px}.coach-rule{font-size:.86rem;padding:10px;border-radius:10px;background:rgba(61,214,140,.10);border:1px solid rgba(61,214,140,.25)}@media(max-width:520px){.player-profile{grid-template-columns:1fr}}

  /* ---- Version 2.0: Gym & 6er-Scout ---- */
  .pro-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:12px 0}
  .pro-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
  .pro-card h4{font-family:'Oswald',sans-serif;margin:0 0 6px;font-size:18px}
  .tag-row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .tag{font-size:12px;padding:4px 8px;border-radius:999px;background:var(--bg-elev-2);border:1px solid var(--border);color:var(--chalk-dim)}
  .exercise-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin:10px 0}
  .exercise-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .exercise-title{font-family:'Oswald',sans-serif;font-size:20px}
  .exercise-meta{color:var(--chalk-dim);font-size:13px;margin:5px 0}
  .set-row{display:grid;grid-template-columns:1fr 110px 100px;gap:8px;margin-top:10px;align-items:end}
  .set-row label{font-size:12px;color:var(--muted)}
  .set-row input{width:100%}
  .primary-btn{background:var(--pitch-light);border:1px solid var(--pitch-light);color:#fff;border-radius:8px;padding:9px 12px;font-weight:700}
  .ghost-btn{background:transparent;border:1px solid var(--border);color:var(--chalk);border-radius:8px;padding:9px 12px}
  .scout-meter{margin:12px 0}
  .scout-head{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:5px}
  .meter{height:9px;border-radius:99px;background:#08162d;overflow:hidden;border:1px solid var(--border)}
  .meter > span{display:block;height:100%;background:var(--pitch-light);border-radius:99px}
  .session-banner{border:1px solid var(--pitch-light);background:linear-gradient(135deg,rgba(62,116,199,.20),rgba(18,42,84,.9));border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .session-banner .eyebrow{text-transform:uppercase;letter-spacing:.09em;font-size:11px;color:var(--chalk-dim)}
  .session-banner h3{font-size:26px;margin-top:3px}
  @media(max-width:620px){.pro-grid{grid-template-columns:1fr}.set-row{grid-template-columns:1fr 1fr}.set-row .wide{grid-column:1/-1}}


  /* ===== LUCA6 · Mission Bundesliga · Redesign 3.0 ===== */
  :root{
    --bg:#07111f;--bg-elev:#0d1c2f;--bg-elev-2:#132943;--pitch:#17b26a;
    --pitch-light:#42d392;--chalk:#f6f8fb;--chalk-dim:#c5cfdb;--muted:#8291a6;
    --amber:#f6c453;--border:rgba(255,255,255,.10);--radius:18px;
  }
  body{background:
    radial-gradient(circle at 85% -10%,rgba(23,178,106,.22),transparent 34%),
    radial-gradient(circle at -10% 25%,rgba(36,99,235,.17),transparent 32%),var(--bg);
    padding-bottom:96px}
  .wrap{max-width:920px;padding:calc(1.1rem + env(safe-area-inset-top)) 1rem 0}
  .topbar{margin-bottom:1rem}.brand .logo{width:42px;height:42px;border-radius:13px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  .brand span{font-size:18px;color:#fff;letter-spacing:.12em}.brand span::after{content:'MISSION BUNDESLIGA';display:block;font:600 9px/1.3 Inter,sans-serif;color:var(--pitch-light);letter-spacing:.16em;margin-top:2px}
  .profiles{display:none}
  .mission-hero{position:relative;overflow:hidden;border:1px solid rgba(66,211,146,.35);border-radius:24px;padding:22px 20px;margin-bottom:16px;background:linear-gradient(135deg,rgba(23,178,106,.22),rgba(13,28,47,.96) 55%,rgba(36,99,235,.20));box-shadow:0 18px 50px rgba(0,0,0,.28)}
  .mission-hero:after{content:'6';position:absolute;right:12px;top:-35px;font:700 150px/1 Oswald,sans-serif;color:rgba(255,255,255,.055)}
  .mission-kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--pitch-light);font-weight:800}
  .mission-hero h1{font-size:clamp(30px,8vw,52px);line-height:1;margin:7px 0 9px}.mission-hero p{margin:0;color:var(--chalk-dim);max-width:600px;font-size:14px}
  .mission-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.mission-tags span{font-size:11px;font-weight:700;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--border)}
  .scoreboard{border-radius:18px;background:rgba(13,28,47,.82);backdrop-filter:blur(12px);box-shadow:0 12px 35px rgba(0,0,0,.20)}
  .section-nav{position:sticky;top:0;z-index:20;background:rgba(7,17,31,.88);backdrop-filter:blur(16px);margin:0 -1rem 1.2rem;padding:10px 1rem 5px;overflow-x:auto;gap:8px;border:0;scrollbar-width:none}
  .section-nav::-webkit-scrollbar{display:none}.section-nav button{padding:9px 12px;margin:0;border:1px solid transparent;border-radius:999px;font-family:Inter,sans-serif;font-size:12px;font-weight:750;letter-spacing:0;text-transform:none;white-space:nowrap}
  .section-nav button.active{background:var(--pitch);border-color:var(--pitch-light);color:white;box-shadow:0 8px 20px rgba(23,178,106,.25)}
  .card,.pro-card,.exercise-card,.dash-card{background:linear-gradient(145deg,rgba(19,41,67,.90),rgba(13,28,47,.90));border-color:var(--border);box-shadow:0 12px 32px rgba(0,0,0,.18)}
  .dashboard-grid{grid-template-columns:repeat(4,1fr)}.dash-card{border-radius:18px;min-height:105px}.dash-card .big{color:#fff;font-size:22px}.dash-card .kicker{color:var(--pitch-light);font-weight:800}
  .coach-box{border-left:0;border:1px solid rgba(66,211,146,.35);background:linear-gradient(135deg,rgba(23,178,106,.18),rgba(13,28,47,.9))}.coach-title{font-size:23px}
  .btn,.primary-btn{background:var(--pitch);border-color:var(--pitch-light);border-radius:12px;font-weight:750;padding:.65rem 1rem}.btn:hover,.primary-btn:hover{background:#13985b}.btn.subtle,.ghost-btn{background:rgba(255,255,255,.04);border-color:var(--border);color:var(--chalk-dim)}
  input,select,textarea{border-radius:11px;background:#091728;padding:.65rem .7rem}
  .session-banner{border-radius:22px;background:linear-gradient(135deg,rgba(23,178,106,.20),rgba(13,28,47,.95));border-color:rgba(66,211,146,.35)}
  .session-banner h3{font-size:30px}.video-link{background:#ff0033;box-shadow:0 7px 18px rgba(255,0,51,.20)}
  .progress-bar,.meter{background:#06101d}.progress-bar span,.meter>span{background:linear-gradient(90deg,var(--pitch),var(--pitch-light))}
  .achievement.unlocked{border-color:rgba(246,196,83,.55);background:rgba(246,196,83,.08)}
  .app-version{text-align:center;opacity:.5;font-size:.72rem;padding:18px}
  @media(max-width:700px){.dashboard-grid{grid-template-columns:repeat(2,1fr)}.mission-hero{padding:19px 17px}.section-nav{position:sticky}.scoreboard{padding:.9rem}.card{padding:1rem}.exercise-top{flex-direction:column}.video-link{align-self:flex-start}}

</style>

    ]}
  ];

  var state = null;
  var currentProfile = "sohn";
  var currentSection = "dashboard";
  var STORAGE_KEY = "ft-app-state-v1";

  function defaultState(){
    return {
      sohn: { label: "Luca", role: "U19 · Westf.-Liga", plan: JSON.parse(JSON.stringify(DEFAULT_PLANS.sohn)), log: [], matchday: "", readiness: [], metrics: [] },
      fuerte: { done: {}, log: {} },
      events: []
    };
  }

  async function loadState(){
    try{
      if(window.storage && typeof window.storage.get === "function"){
        var res = await window.storage.get(STORAGE_KEY, false);
        if(res && res.value) return migrateState(JSON.parse(res.value));
      }
    }catch(e){}
    try{
      var local = localStorage.getItem(STORAGE_KEY);
      if(local) return migrateState(JSON.parse(local));
    }catch(e){}
    return defaultState();
  }

  async function saveState(){
    var payload = JSON.stringify(state);
    try{ localStorage.setItem(STORAGE_KEY, payload); }catch(e){ console.error("Lokales Speichern fehlgeschlagen", e); }
    try{
      if(window.storage && typeof window.storage.set === "function") await window.storage.set(STORAGE_KEY, payload, false);
    }catch(e){}
  }

  function migrateState(s){
    if(!s || !s.sohn) return defaultState();
    if(!Array.isArray(s.sohn.log)) s.sohn.log = [];
    if(!Array.isArray(s.sohn.readiness)) s.sohn.readiness = [];
    if(!Array.isArray(s.sohn.metrics)) s.sohn.metrics = [];
    if(!Array.isArray(s.events)) s.events = [];
    if(!s.fuerte) s.fuerte = {done:{},log:{}};
    return s;
  }

    var now = new Date();
    now.setHours(0,0,0,0);

    if(diffDays > 1) return { text: String(diffDays), sub: "Tage" };
    if(diffDays === 1) return { text: "1", sub: "Tag" };
    if(diffDays === 0) return { text: "Heute", sub: "Anstoß!" };
    return { text: "–", sub: "Datum liegt in der Vergangenheit" };

  function completedPlanStats(){
    var p=state[currentProfile], total=0, done=0;
    DAYS.forEach(function(d){(p.plan[d]||[]).forEach(function(e){total++;if(e.done)done++;});});
    return {total:total,done:done,pct:total?Math.round(done/total*100):0};
  }
  function trainingStreak(log){
    if(!log.length) return 0;
    var dates={}; log.forEach(function(e){dates[e.date]=true;});
    var d=new Date(); d.setHours(0,0,0,0); var streak=0;
    if(!dates[ymd(d)]) d.setDate(d.getDate()-1);
    while(dates[ymd(d)]){streak++;d.setDate(d.getDate()-1);}
    return streak;
  }

  function renderPlan(){
    var p = state[currentProfile];
    var wrap = document.createElement("div");
    DAYS.forEach(function(day){
      var exList = p.plan[day] || [];
      var block = document.createElement("div");
      block.className = "day-block card";
      var title = document.createElement("div");
      title.className = "day-title";
      title.textContent = day;
      block.appendChild(title);

      if(exList.length === 0){
        var empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Noch keine Übung eingetragen.";
        block.appendChild(empty);
      }

      exList.forEach(function(ex, idx){
        var row = document.createElement("div");
        row.className = "exercise-row" + (ex.done ? " done" : "");
        var cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = !!ex.done;
        cb.addEventListener("change", function(){
          ex.done = cb.checked;
          saveState();
          renderPlan();
        });
        var span = document.createElement("span");
        span.className = "ex-text";
        span.textContent = typeof ex === "string" ? ex : ex.text;
        var delBtn = document.createElement("button");
        delBtn.className = "del";
        delBtn.setAttribute("aria-label", "Übung löschen");
        delBtn.textContent = "✕";
        delBtn.addEventListener("click", function(){
          p.plan[day].splice(idx, 1);
          saveState();
          renderPlan();
        });
        row.appendChild(cb);
        row.appendChild(span);
        row.appendChild(delBtn);
        block.appendChild(row);
      });

      var addRow = document.createElement("div");
      addRow.className = "add-ex";
      var input = document.createElement("input");
      input.type = "text";
      input.placeholder = "Übung hinzufügen …";
      var addBtn = document.createElement("button");
      addBtn.className = "btn small";
      addBtn.textContent = "Hinzufügen";
      function addExercise(){
        var val = input.value.trim();
        if(!val) return;
        if(!p.plan[day]) p.plan[day] = [];
        p.plan[day].push({ text: val, done: false });
        input.value = "";
        saveState();
        renderPlan();
      }
      addBtn.addEventListener("click", addExercise);
      input.addEventListener("keydown", function(e){ if(e.key === "Enter") addExercise(); });
      addRow.appendChild(input);
      addRow.appendChild(addBtn);
      block.appendChild(addRow);

      wrap.appendChild(block);
    });

    // Normalize old string-based exercises to objects on first render
    var target = id("sectionPlan");
    target.innerHTML = "";
    target.appendChild(wrap);
  }

  function normalizePlan(p){
    DAYS.forEach(function(day){
      if(!p.plan[day]) p.plan[day] = [];
      p.plan[day] = p.plan[day].map(function(ex){
        return typeof ex === "string" ? { text: ex, done: false } : ex;
      });
    });
  }

  function weekLogCount(log){
    var now = new Date();
    var start = new Date(now);
    var dow = (start.getDay() + 6) % 7; // Montag = 0
    start.setDate(start.getDate() - dow);
    start.setHours(0,0,0,0);
    var count = 0, minutes = 0;
    log.forEach(function(e){
      var d = new Date(e.date + "T00:00:00");
      if(d >= start){ count++; minutes += (e.duration || 0); }
    });
    return { count: count, minutes: minutes };
  }

  function drawMetricChart(entries){
    var c=id('metricChart'); if(!c)return; var rect=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    c.width=Math.max(320,rect.width*dpr); c.height=Math.max(180,rect.height*dpr); var x=c.getContext('2d'); x.scale(dpr,dpr);
    var w=rect.width,h=rect.height,pad=30; x.clearRect(0,0,w,h); x.strokeStyle='rgba(255,255,255,.12)';x.lineWidth=1;
    for(var i=0;i<4;i++){var yy=pad+(h-pad*2)*i/3;x.beginPath();x.moveTo(pad,yy);x.lineTo(w-pad,yy);x.stroke();}
    function line(key,stroke){var vals=entries.map(function(e){return e[key];}).filter(function(v){return v;});if(vals.length<1)return;var min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);if(max===min){max+=1;min-=1;}x.strokeStyle=stroke;x.lineWidth=2;x.beginPath();var started=false;entries.forEach(function(e,j){if(!e[key])return;var px=pad+(w-pad*2)*(entries.length===1 ? .5 : j/(entries.length-1));var py=h-pad-(e[key]-min)/(max-min)*(h-pad*2);if(!started){x.moveTo(px,py);started=true;}else{x.lineTo(px,py);}x.fillStyle=stroke;x.fillRect(px-2,py-2,4,4);});x.stroke();}
    line('weight','#ffb703'); line('sprint','#4cc9f0'); x.font='11px sans-serif';x.fillStyle='#ffb703';x.fillText('Gewicht',pad,14);x.fillStyle='#4cc9f0';x.fillText('30-m-Sprint',pad+65,14);
  }

    if(!state.sohn){ state = defaultState(); }
    normalizePlan(state.sohn);
    ensureEvents();
    renderScoreboard();
    renderDashboard();
    renderPlan();
    renderTermine();
    renderTracking();
    renderGym();
    renderScout();
    renderErnaehrung();
    renderFuerte();
  }

  function setupSectionNav(){
    var buttons = id("sectionNav").querySelectorAll("button");
    buttons.forEach(function(btn){
      btn.addEventListener("click", function(){
        buttons.forEach(function(b){ b.classList.remove("active"); });
        btn.classList.add("active");
        currentSection = btn.getAttribute("data-section");
        id("sectionDashboard").style.display = currentSection === "dashboard" ? "" : "none";
        id("sectionPlan").style.display = currentSection === "plan" ? "" : "none";
        id("sectionTermine").style.display = currentSection === "termine" ? "" : "none";
        id("sectionTracking").style.display = currentSection === "tracking" ? "" : "none";
        id("sectionGym").style.display = currentSection === "gym" ? "" : "none";
        id("sectionScout").style.display = currentSection === "scout" ? "" : "none";
        id("sectionErnaehrung").style.display = currentSection === "ernaehrung" ? "" : "none";
        id("sectionFuerte").style.display = currentSection === "fuerte" ? "" : "none";
      });
    });
  }

  setupSectionNav();

  loadState().then(function(s){
    state = s;
    renderAll();
  });

})();
</script>

    navigator.serviceWorker.register("./service-worker.js").catch(function () {});
